name: UI - Deploy to Live (manual, promote a tested image)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA already deployed & tested on staging (use an older SHA to roll back)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    # Configure "Required reviewers" on the 'live' environment in GitHub settings.
    environment: live
    steps:
      - name: Validate tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "image_tag must be a full 40-char commit SHA"; exit 1; }

      - name: Lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check image exists in GHCR
        run: docker manifest inspect ghcr.io/${{ env.OWNER }}/devops-demo-ui:${{ inputs.image_tag }} > /dev/null

      - name: Deploy UI to live server
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG
          script_stop: true
          script: /opt/devops-demo/deploy.sh ui "$IMAGE_TAG"
