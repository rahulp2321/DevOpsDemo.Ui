services:
  postgres:
    image: postgres:18
    container_name: devops-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devopsdemo}
      POSTGRES_USER: ${POSTGRES_USER:-devopsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devopspassword}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devopsuser} -d ${POSTGRES_DB:-devopsdemo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-devops-demo-api:local}
    ports:
    - "8080:8080"
    container_name: devops-demo-api
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-devopsdemo};Username=${POSTGRES_USER:-devopsuser};Password=${POSTGRES_PASSWORD:-devopspassword}
      APP_VERSION: ${APP_VERSION:-local}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  ui:
    image: ${UI_IMAGE:-devops-demo-ui:local}
    container_name: devops-demo-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  postgres_data:
