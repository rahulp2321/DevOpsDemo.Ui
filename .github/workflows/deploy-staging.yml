name: UI - Build Docker and Deploy Staging

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    environment: staging

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}


      - name: Build UI Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ secrets.GHCR_USERNAME }}/devops-demo-ui:${{ github.sha }} \
            .


      - name: Push UI Docker Image
        run: |
          docker push \
            ghcr.io/${{ secrets.GHCR_USERNAME }}/devops-demo-ui:${{ github.sha }}


      - name: Deploy UI to Staging EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

          script: |

            set -e

            cd /opt/devops-demo

            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            echo "Pulling UI image..."

            docker pull \
              ghcr.io/${{ secrets.GHCR_USERNAME }}/devops-demo-ui:${{ github.sha }}

            echo "Updating UI version..."

            sed -i \
              "s/^UI_TAG=.*/UI_TAG=${{ github.sha }}/" \
              .env

            echo "Starting UI container..."

            docker compose up -d ui

            echo "Checking UI container..."

            docker ps

            echo "UI deployment completed."